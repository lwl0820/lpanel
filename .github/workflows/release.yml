name: 发布版本
run-name: 发布 ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 已有版本标签（例如 v0.1.1）
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 校验版本标签
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '请输入 vX.Y.Z 格式的正式版本标签' >&2
            exit 1
          fi

      - name: 检出标签源码
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 构建发行包
        run: |
          mkdir -p .tmp/build .tmp/npm-cache
          export TMPDIR="$PWD/.tmp/build"
          export npm_config_cache="$PWD/.tmp/npm-cache"
          npm --prefix web ci
          bash scripts/build-release.sh "$RELEASE_TAG"

      - name: 校验并发布发行包
        working-directory: .tmp/releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          amd64="lpanel_${RELEASE_TAG}_linux_amd64.tar.gz"
          arm64="lpanel_${RELEASE_TAG}_linux_arm64.tar.gz"
          sha256sum --check "$amd64.sha256" "$arm64.sha256"
          gh release create "$RELEASE_TAG" "$amd64" "$amd64.sha256" "$arm64" "$arm64.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
