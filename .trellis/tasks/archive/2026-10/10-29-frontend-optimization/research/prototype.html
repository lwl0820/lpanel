<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPanel 界面原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 布局：白色侧栏 + 浅灰工作区；手机宽度下侧栏变为底部标签栏。只做浅色主题（用户已确认），所以不定义暗色块。 */
:root {
  color-scheme: light;
  --bg: #f4f6f9;          /* 工作区底色，略偏蓝的灰 */
  --surface: #ffffff;     /* 侧栏、面板 */
  --sunken: #f8f9fb;      /* 表头、代码区、空状态图标底 */
  --line: #e3e7ee;        /* 细边框 */
  --line-strong: #cfd6e1;
  --fg: #1c2433;          /* 正文 */
  --muted: #5b6577;       /* 次要文字，对白底对比度约 5.9:1 */
  --faint: #7a8496;       /* 提示文字，约 4.0:1，只用于 13px 以上 */
  --accent: #3563e9;      /* 唯一主色 */
  --accent-hover: #2a52c9;
  --accent-soft: #edf2fe;
  --ok: #17803d;   --ok-soft: #e8f6ed;
  --warn: #a35a00; --warn-soft: #fdf3e3;
  --bad: #c42b2b;  --bad-soft: #fdecec;
  --log-bg: #1c2433; --log-fg: #d9dee7;
  --scrim: rgba(28, 36, 51, .38);
  --shadow: 0 1px 2px rgba(28,36,51,.05);
  --shadow-pop: 0 8px 28px rgba(28,36,51,.14), 0 1px 3px rgba(28,36,51,.08);
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  /* 字号阶梯：12 / 13 / 14 / 16 / 20 / 28 */
  --t-xs: .75rem; --t-sm: .8125rem; --t-md: .875rem; --t-lg: 1rem; --t-xl: 1.25rem; --t-2xl: 1.75rem;
  --r: 8px; --r-sm: 6px;
  --side-w: 216px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: var(--t-md); line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* 原型切换条：只属于原型，不进产品 */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--fg); color: var(--log-fg); font-size: var(--t-xs); }
.proto b { color: #fff; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid #3a4558; border-radius: var(--r-sm); overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--log-fg); padding: 3px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #3a4558; color: #fff; }
/* 外框 */
.app { display: flex; align-items: flex-start; min-height: calc(100vh - 40px); }
.side { position: sticky; top: env(safe-area-inset-top, 0px); flex: 0 0 var(--side-w); height: 100vh; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; font-weight: 600; font-size: var(--t-lg); }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand small { font-weight: 400; color: var(--faint); font-size: var(--t-xs); }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 8px 10px; border-radius: var(--r-sm); color: var(--muted); cursor: pointer; text-align: left; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { background: var(--sunken); color: var(--fg); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: var(--t-sm); flex: none; }
.side-foot .who { flex: 1; min-width: 0; font-size: var(--t-sm); }
.side-foot .who span { display: block; color: var(--faint); font-size: var(--t-xs); }
.topbar { display: none; }
.main { flex: 1; min-width: 0; padding-block: 28px 48px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.content { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }

/* 页头 */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.head h1 { font-size: var(--t-xl); }
.head p { color: var(--muted); margin-top: 4px; max-width: 60ch; }
.head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* 按钮 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; white-space: nowrap; font-size: var(--t-md); }
.btn svg { width: 16px; height: 16px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--sunken); color: var(--fg); }
.btn.sm { height: 28px; padding: 0 10px; font-size: var(--t-sm); }
.btn.icon { width: 30px; height: 30px; padding: 0; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; text-underline-offset: 2px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 面板与表格 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.panel-h h2 { font-size: var(--t-lg); }
.panel-h .muted { font-size: var(--t-sm); }
.panel-b { padding: 18px; }
.panel-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--sunken); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: var(--t-sm); color: var(--muted); background: var(--sunken); padding: 9px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: #fafbfd; }
td .name { font-weight: 600; }
td .sub { display: block; color: var(--faint); font-size: var(--t-sm); }
td.actions { text-align: right; white-space: nowrap; width: 1%; }
td.actions .row-act { display: inline-flex; gap: 4px; align-items: center; }
/* 状态标记：状态色与主色分开 */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: var(--t-sm); font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--sunken); color: var(--muted); }
.pill.run { background: var(--accent-soft); color: var(--accent); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--sunken); color: var(--muted); font-size: var(--t-xs); white-space: nowrap; }
.err-line { display: block; margin-top: 4px; color: var(--bad); font-size: var(--t-sm); max-width: 38ch; white-space: normal; }

/* 概览 */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat { display: grid; gap: 2px; padding: 18px 20px; border: 0; border-right: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
.stat:last-child { border-right: 0; }
.stat:hover { background: var(--sunken); }
.stat .lbl { color: var(--muted); font-size: var(--t-sm); }
.stat .val { font-size: var(--t-2xl); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat .val.warn { color: var(--warn); }
.stat .val.bad { color: var(--bad); }
.stat .hint { color: var(--faint); font-size: var(--t-sm); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.todo li:last-child { border-bottom: 0; }
.todo .dot { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.todo .dot svg { width: 15px; height: 15px; }
.todo .dot.bad { background: var(--bad-soft); color: var(--bad); }
.todo .dot.warn { background: var(--warn-soft); color: var(--warn); }
.todo .dot.info { background: var(--accent-soft); color: var(--accent); }
.todo .dot.ok { background: var(--ok-soft); color: var(--ok); }
.todo .txt { flex: 1; min-width: 0; }
.todo .txt b { display: block; font-weight: 600; }
.todo .txt span { color: var(--muted); font-size: var(--t-sm); overflow-wrap: anywhere; }
.todo .btn { flex: none; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 20px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

/* 空状态 */
.empty { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 48px 20px 52px; }
.empty .ico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); border: 1px solid var(--line); color: var(--faint); margin-bottom: 4px; }
.empty .ico svg { width: 22px; height: 22px; }
.empty h3 { font-size: var(--t-lg); }
.empty p { color: var(--muted); max-width: 42ch; }
.empty .btn { margin-top: 8px; }

/* 表单 */
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 500; font-size: var(--t-sm); }
.field .hint { color: var(--faint); font-size: var(--t-sm); }
.input, .select, .textarea { width: 100%; height: 36px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); }
.textarea { height: auto; padding: 10px 11px; font-family: var(--mono); font-size: var(--t-sm); line-height: 1.6; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.invalid { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.inline { display: flex; gap: 8px; }
.inline .input { flex: 1; min-width: 0; }
.check { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.check input { margin: 3px 0 0; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.settings { display: grid; gap: 20px; max-width: 760px; }
/* 行内“更多”菜单：固定定位，避免被表格滚动容器裁剪 */
.menu { position: fixed; z-index: 40; min-width: 168px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-pop); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: transparent; border-radius: 4px; cursor: pointer; text-align: left; white-space: nowrap; }
.menu button svg { width: 16px; height: 16px; color: var(--faint); }
.menu button:hover, .menu button:focus-visible { background: var(--sunken); outline: none; }
.menu button.danger, .menu button.danger svg { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* 抽屉与对话框 */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); display: flex; justify-content: flex-end; animation: fade .15s ease-out; }
.scrim.center { justify-content: center; align-items: center; padding: 16px; }
@keyframes fade { from { opacity: 0; } }
.drawer { width: min(640px, 100%); height: 100%; background: var(--surface); display: flex; flex-direction: column; box-shadow: var(--shadow-pop); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: slide .2s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
.drawer-h, .modal-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.drawer-h h2, .modal-h h2 { font-size: var(--t-lg); }
.drawer-h p { color: var(--muted); font-size: var(--t-sm); margin-top: 2px; }
.drawer-b { flex: 1; overflow-y: auto; padding: 20px; display: grid; gap: 24px; align-content: start; }
.drawer-f, .modal-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--sunken); }
.block { display: grid; gap: 12px; }
.block-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.block-h h3 { font-size: var(--t-md); }
.ports { border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.ports-empty { padding: 14px; color: var(--faint); font-size: var(--t-sm); text-align: center; background: var(--sunken); }
.ports th, .ports td { padding: 8px 12px; }
.log { margin: 0; padding: 14px; border-radius: var(--r-sm); background: var(--log-bg); color: var(--log-fg); font-family: var(--mono); font-size: var(--t-xs); line-height: 1.7; overflow: auto; max-height: 320px; white-space: pre; }
.modal { width: min(460px, 100%); background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-pop); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; animation: pop .15s ease-out; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } }
.modal-b { padding: 20px; overflow-y: auto; display: grid; gap: 16px; }
.modal-b > p { color: var(--muted); }

/* 提示 */
.toasts { position: fixed; z-index: 50; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; width: max-content; max-width: calc(100% - 32px); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: var(--r); background: var(--fg); color: #fff; box-shadow: var(--shadow-pop); font-size: var(--t-sm); animation: pop .15s ease-out; }
.toast svg { width: 16px; height: 16px; flex: none; }
.toast.ok svg { color: #6fd795; }
.toast.bad svg { color: #ff8f8f; }

/* 登录 */
.login { min-height: calc(100vh - 40px); display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 32px 28px 28px; display: grid; gap: 20px; }
.login-card .brand { padding: 0; }
.login-card h1 { font-size: var(--t-xl); }
.login-card .sub { color: var(--muted); margin-top: 4px; }
.login-card .btn { width: 100%; height: 38px; }
.login-foot { text-align: center; color: var(--faint); font-size: var(--t-xs); }
/* 中等宽度 */
@media (max-width: 1080px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(2) { border-right: 0; }
  .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
/* 手机：侧栏变底部标签栏，表格变卡片列表，抽屉全屏 */
@media (max-width: 760px) {
  .app { display: block; }
  .side { position: fixed; top: auto; left: 0; right: 0; bottom: 0; height: auto; z-index: 20; flex-direction: row; padding: 4px 0 env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); border-right: 0; border-top: 1px solid var(--line); }
  .side .brand, .side-foot { display: none; }
  .nav { grid-template-columns: repeat(5, minmax(0, 1fr)); width: 100%; gap: 0; }
  .nav button { flex-direction: column; gap: 2px; padding: 6px 2px; font-size: var(--t-xs); text-align: center; border-radius: 0; }
  .nav button[aria-current="page"] { background: transparent; }
  .nav button svg { width: 20px; height: 20px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar .brand { padding: 0; font-size: var(--t-md); }
  .main { padding-block: 20px calc(88px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .content { gap: 16px; }
  .head { align-items: flex-start; }
  .head .actions { width: 100%; }
  .head .actions .btn.primary { flex: 1; }
  .stat { padding: 14px 16px; }
  .stat .val { font-size: var(--t-xl); }
  .cols2 { grid-template-columns: minmax(0, 1fr); }
  .rtable thead { display: none; }
  .rtable, .rtable tbody, .rtable tr, .rtable td { display: block; width: auto; }
  .rtable tr { position: relative; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .rtable tbody tr:last-child { border-bottom: 0; }
  .rtable td { padding: 2px 0; border: 0; }
  .rtable tbody tr:hover td { background: transparent; }
  .rtable td.first { padding-right: 136px; margin-bottom: 6px; }
  .rtable td[data-label] { display: flex; gap: 12px; align-items: baseline; font-size: var(--t-sm); }
  .rtable td[data-label]::before { content: attr(data-label); flex: 0 0 64px; color: var(--faint); }
  .rtable td.actions { position: absolute; top: 12px; right: 12px; width: auto; }
  .drawer { width: 100%; }
  .toasts { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
}
</style>

<div class="proto" role="region" aria-label="原型控制">
  <b>LPanel 界面原型</b><span>示例数据，非真实服务器</span>
  <span class="seg" role="group" aria-label="画面"><button id="p-app" data-act="screen" data-v="app" aria-pressed="true">面板</button><button id="p-login" data-act="screen" data-v="login" aria-pressed="false">登录页</button></span>
  <span class="seg" role="group" aria-label="数据"><button id="p-full" data-act="data" data-v="full" aria-pressed="true">有数据</button><button id="p-empty" data-act="data" data-v="empty" aria-pressed="false">新装空面板</button></span>
</div>

<div id="login" class="login" hidden>
  <form class="login-card" id="login-form" novalidate>
    <div class="brand" data-logo>LPanel</div>
    <div><h1>登录服务器面板</h1><p class="sub">使用初始化时设置的管理员账号。</p></div>
    <div class="field"><label for="lg-user">用户名</label><input class="input" id="lg-user" autocomplete="username" value="admin"></div>
    <div class="field"><label for="lg-pass">密码</label><input class="input" id="lg-pass" type="password" autocomplete="current-password" value="shotpass123"></div>
    <button class="btn primary" type="submit">登录</button>
    <p class="login-foot">LPanel v0.2.1</p>
  </form>

  return !bad

document.addEventListener('click', e => {
  if (e.target.classList?.contains('scrim')) return closeLayer()
  if (e.target.closest('[data-close]')) return closeLayer()
  const el = e.target.closest('[data-act]')
  if (!el) { if (!e.target.closest('#menu')) closeMenu(); return }
  e.preventDefault()
  const act = el.dataset.act
  if (act !== 'menu') closeMenu()
  const x = el.dataset.id ? find(el.dataset.kind || (act === 'cert' ? 'binding' : act.includes('site') ? 'site' : 'project'), el.dataset.id) : null
