<script>
const icons = {"overview": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"9\" rx=\"1.5\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\" rx=\"1.5\"/><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\" rx=\"1.5\"/><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\" rx=\"1.5\"/>", "projects": "<path d=\"M21 8 12 3 3 8v8l9 5 9-5V8Z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/>", "images": "<path d=\"m3 8 9-5 9 5-9 5-9-5Zm0 4 9 5 9-5M3 16l9 5 9-5\"/>", "sites": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 9h18M7 6.5h.01M10 6.5h.01\"/>", "domains": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18\"/>", "server": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"7\" rx=\"2\"/><rect x=\"3\" y=\"14\" width=\"18\" height=\"7\" rx=\"2\"/><path d=\"M7 6.5h.01M7 17.5h.01\"/>", "folder": "<path d=\"M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z\"/>", "settings": "<path d=\"M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0\"/><circle cx=\"16\" cy=\"6\" r=\"2\"/><circle cx=\"10\" cy=\"12\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/>", "more": "<circle cx=\"5\" cy=\"12\" r=\"1\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/><circle cx=\"19\" cy=\"12\" r=\"1\"/>", "chevron": "<path d=\"m9 6 6 6-6 6\"/>", "plus": "<path d=\"M12 5v14M5 12h14\"/>", "refresh": "<path d=\"M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4\"/>", "play": "<path d=\"M7 5v14l11-7L7 5Z\"/>", "stop": "<rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"1.5\"/>", "restart": "<path d=\"M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5\"/>", "log": "<path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Z\"/><path d=\"M14 3v6h6M8 13h8M8 17h5\"/>", "edit": "<path d=\"M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4\"/>", "download": "<path d=\"M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4\"/>", "upload": "<path d=\"M12 15V3m-5 5 5-5 5 5M4 16v4h16v-4\"/>", "link": "<path d=\"M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1\"/>", "trash": "<path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/>", "cert": "<path d=\"M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z\"/><path d=\"m9 12 2 2 4-4\"/>", "alert": "<path d=\"M12 9v4M12 17h.01\"/><path d=\"M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>", "up": "<path d=\"M12 19V5M6 11l6-6 6 6\"/>", "check": "<path d=\"m5 12 5 5L20 7\"/>", "x": "<path d=\"M6 6l12 12M18 6 6 18\"/>", "logout": "<path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4\"/>"};
function icon(k){return '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+icons[k]+'</svg>'}
side.innerHTML=[['overview','概览'],['projects','容器管理'],['play','程序管理'],['sites','静态网站'],['domains','域名与证书'],['server','服务器管理'],['settings','面板设置']].map(([k,t])=>'<div class="sideitem '+(k==='play'?'selected':'')+'">'+icon(k)+t+'</div>').join('');
const labels=['运行中','已停止','启动失败'];
const entries=[
 ['订单服务','order-api',0,24816,'2.4%','86 MB',8080,12],['消息处理','queue-worker',0,24842,'0.8%','42 MB',0,3],
 ['报表生成','report-job',2,0,'—','—',0,0],['图片处理','image-worker',0,25124,'3.1%','112 MB',0,4],
 ['回调服务','webhook',0,25213,'0.3%','28 MB',9090,6],['索引重建','index-builder',1,0,'—','—',0,0],
].map(([name,slug,state,pid,cpu,mem,port,conn],i)=>({name,slug,state,pid,cpu,mem,port,conn,id:21+i,entry:'bin/'+slug,user:'www-data',args:i===0?'--port 8080':''}));
const view=document.getElementById('view'), modal=document.getElementById('modal');
let index=0, filter=-1, expanded=true, tab='log', full=false;
const mode=()=>['a','b','c'].includes(location.hash.slice(1))?location.hash.slice(1):'b';
const esc=v=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const tag=s=>'<span class="tag s'+s+'"><i></i>'+labels[s]+'</span>';
const dir=p=>'/opt/lpanel/data/programs/'+p.id;
const button=(label,act,i,cls='btn',ico='')=>'<button type="button" class="'+cls+'" data-do="'+act+'" data-index="'+i+'">'+(ico?icon(ico)+' ':'')+label+'</button>';
const available=()=>entries.map((p,i)=>({p,i})).filter(({p})=>filter<0||p.state===filter);
const counts=s=>entries.filter(p=>p.state===s).length;
function field(k,v){return '<div><span>'+k+'</span><b class="mono">'+esc(v)+'</b></div>'}
function port(p,i){return p.state===0&&p.port?button(':'+p.port,'domain',i,'port'):'—'}
function run(p,i){return button(p.state===0?'停止':'启动',p.state===0?'stop':'start',i,'btn',p.state===0?'stop':'play')}
function filters(){return '<div class="segments">'+[-1,0,1,2].map(s=>button((s<0?'全部':labels[s])+' '+(s<0?entries.length:counts(s)),'filter',s,'seg '+(filter===s?'active':''))).join('')+'</div>'}
function logs(p){
 const data=p.state===2?[['09:41:02','INFO','正在启动 '+p.slug],['09:41:02','ERROR','入口文件 '+p.entry+' 没有执行权限'],['09:41:05','ERROR','重试后仍无法启动，请检查启动设置']]:p.state===1?[['09:30:01','INFO','收到停止信号'],['09:30:02','INFO','程序已停止']]:[['09:42:01','INFO','正在启动 '+p.slug],['09:42:01','INFO','已加载运行配置'],['09:42:02','INFO',p.port?'正在监听 127.0.0.1:'+p.port:'已连接任务队列'],['09:42:05','INFO','就绪检查通过'],['09:43:10','INFO',p.port?'GET /health   200   2ms':'任务已处理，用时 12ms']];
 return '<div class="line loghead"><small>最近输出</small><small>'+ (p.state===0?'跟踪中':'跟踪已停止')+'</small></div><div class="console">'+data.map(([time,level,msg])=>'<div><span class="time">'+time+'</span>　<span class="'+(level==='ERROR'?'error':'lvl')+'">'+level+'</span>　'+esc(msg)+'</div>').join('')+'</div>';
}
function detail(p,i){return '<section class="panel detailpad"><div class="line"><div><div class="hero-id"><span class="mark">'+icon('play')+'</span><h2>'+esc(p.name)+'</h2>'+tag(p.state)+'</div><small class="mono">'+esc(p.entry)+'</small></div><div class="actions">'+run(p,i)+button('更多','more',i)+'</div></div><div class="metrics">'+[['PID',p.state===0?p.pid:'—'],['CPU',p.state===0?p.cpu:'—'],['内存',p.state===0?p.mem:'—'],['TCP 连接',p.state===0?p.conn:'—']].map(([k,v])=>'<div class="metric"><small>'+k+'</small><b class="number">'+v+'</b></div>').join('')+'</div><div class="line"><div class="chips"><small>监听端口</small>'+port(p,i)+'</div>'+button('打开目录','files',i,'plain','folder')+'</div><div class="tabs">'+button('运行日志','tablog',i,'tab '+(tab==='log'?'active':''))+button('启动设置','tabsettings',i,'tab '+(tab==='settings'?'active':''))+'</div>'+(tab==='log'?logs(p):'<div class="info">'+field('入口',p.entry)+field('参数',p.args||'—')+field('运行用户',p.user)+button('编辑设置','settings',i)+'</div>')+'</section>'}
function inline(p,i){return '<div class="inline-detail"><div class="fields">'+field('程序入口',p.entry)+field('运行用户',p.user)+field('PID',p.state===0?p.pid:'—')+field('TCP 连接',p.state===0?p.conn:'—')+'</div><div class="tools">'+button('打开目录','files',i,'plain','folder')+button('启动设置','settings',i,'plain','settings')+button('更多操作','more',i,'plain','more')+'</div></div>'}
function table(){return '<section class="panel"><div class="splithead"><h2>托管程序</h2>'+filters()+'</div><div class="tableregion" tabindex="0" role="region" aria-label="托管程序列表"><table class="overview-table"><thead><tr>'+['程序名称','状态','CPU','内存','监听端口','操作'].map(v=>'<th scope="col">'+v+'</th>').join('')+'</tr></thead><tbody>'+available().map(({p,i})=>'<tr class="'+(expanded&&index===i?'selectedrow':'')+'"><th scope="row">'+button(esc(p.name),'select',i,'namebtn','chevron')+'</th><td>'+tag(p.state)+'</td><td data-label="CPU">'+(p.state===0?p.cpu:'—')+'</td><td data-label="内存">'+(p.state===0?p.mem:'—')+'</td><td data-label="端口">'+port(p,i)+'</td><td>'+button(p.state===0?'停止':'启动',p.state===0?'stop':'start',i,'plain')+'　'+button('日志','logs',i,'plain')+'</td></tr>'+(expanded&&index===i?'<tr class="exp"><td colspan="6">'+inline(p,i)+'</td></tr>':'')).join('')+'</tbody></table></div><div class="footnote">共 '+available().length+' 个程序</div></section>'}
function split(){if(!entries.length)return '<div class="panel empty">暂无托管程序</div>';return '<div class="split"><section class="panel"><div class="splithead"><h2>程序列表<small>'+entries.length+'</small></h2></div><div class="records">'+entries.map((p,i)=>'<button class="record '+(index===i?'active':'')+'" data-do="select" data-index="'+i+'"><div class="line"><b>'+esc(p.name)+'</b>'+tag(p.state)+'</div><small class="mono">'+esc(p.slug)+'</small></button>').join('')+'</div></section>'+detail(entries[index],index)+'</div>'}
function cards(){if(full)return '<div class="boardhead">'+button('‹ 返回所有程序','back',0,'plain')+'</div>'+detail(entries[index],index);
return '<div class="summary panel">'+[0,1,2].map(s=>'<button class="summ '+(s===filter?'active':'')+'" data-do="filter" data-index="'+(s===filter?-1:s)+'">'+tag(s)+'<strong>'+counts(s)+'</strong></button>').join('')+'</div><div class="line boardhead"><h2>'+(filter<0?'所有程序':labels[filter])+'</h2>'+(filter<0?'<small>'+entries.length+' 个程序</small>':button('显示全部','filter',-1,'plain'))+'</div><div class="cards">'+available().sort((a,b)=>(b.p.state===2)-(a.p.state===2)).map(({p,i})=>'<article class="program-card"><div class="cardbody"><div class="cardhead"><h3>'+esc(p.name)+'</h3>'+tag(p.state)+'</div><small class="mono">'+esc(p.slug)+'</small><div class="fields">'+field('CPU',p.state===0?p.cpu:'—')+field('内存',p.state===0?p.mem:'—')+'</div><div class="line">'+(p.state===2?'<small class="failure">入口文件没有执行权限</small>':'<small>监听端口　'+port(p,i)+'</small>')+'</div></div><div class="cardfooter">'+button(p.state===0?'停止':'启动',p.state===0?'stop':'start',i,'tap')+button('日志','logs',i,'tap')+button('详情 →','select',i,'tap')+'</div></article>').join('')+'</div>'}
function render(){document.querySelectorAll('.switch a').forEach(a=>a.classList.toggle('on',a.hash==='#'+mode()));view.innerHTML='<header class="title"><div><h1>程序管理</h1><p>管理直接运行在服务器上的程序。</p></div>'+button('新建程序','new',0,'btn primary','plus')+'</header>'+(mode()==='a'?table():mode()==='b'?split():cards())}
function pop(title,body,submit){document.getElementById('dlgTitle').textContent=title;document.getElementById('dlgBody').innerHTML=body;document.getElementById('dlgFoot').innerHTML='<button type="button" class="btn" onclick="modal.close()">'+(submit?'取消':'返回')+'</button>'+(submit?'<button class="btn primary">'+submit+'</button>':'');if(!modal.open)modal.showModal()}
const input=(label,name,value,required=false)=>'<label>'+label+'<input name="'+name+'" value="'+esc(value)+'" '+(required?'required':'')+'></label>';
let onSave;
document.getElementById('dlgForm').onsubmit=e=>{e.preventDefault();if(onSave)onSave(new FormData(e.target));modal.close();render()};
function act(k,i){const p=entries[i];onSave=null;
 if(k==='filter'){filter=i;render();return} if(k==='back'){full=false;render();return}
 if(k==='select'){expanded=index!==i||!expanded;index=i;tab='log';full=true;render();return}
 if(k==='tablog'||k==='tabsettings'){tab=k==='tablog'?'log':'settings';render();return}
 if(k==='logs'){pop(p.name+' · 运行日志',logs(p));return}
 if(k==='files'){pop('服务器管理 · 文件管理','<div class="info">'+field('当前目录',dir(p))+'</div><p class="muted">正式界面将在现有文件管理中打开此目录。</p>');return}
 if(k==='domain'){pop('绑定域名',field('绑定目标',p.name+' · 127.0.0.1:'+p.port)+input('域名','host','api.example.com')+'<p class="muted">此处沿用现有绑定弹窗及证书账户选择。</p>');return}
 if(k==='more'){pop(p.name+' · 更多操作','<div class="tools">'+['settings','restart','copy','delete'].map((a,j)=>button(['启动设置','重启','复制程序','删除程序'][j],a,i)).join('')+'</div>');return}
 if(k==='settings'||k==='new'){const n=k==='new';pop(n?'新建程序':'启动设置',input('程序名称','name',n?'':p.name,true)+(n?'':input('主程序（相对路径）','entry',p.entry,true)+input('启动参数','args',p.args)+input('运行用户','user',p.user,true)),n?'创建':'保存');onSave=f=>{if(n){entries.push({...entries[0],name:f.get('name'),id:Math.max(20,...entries.map(p=>p.id))+1,slug:'新程序',state:1,port:0,pid:0,cpu:'0.0%',mem:'12 MB',conn:0,user:'www-data',entry:'',args:''});index=entries.length-1;expanded=true;filter=-1}else{for(const key of ['name','entry','args','user'])p[key]=f.get(key)}};return}
 const verb={stop:'停止',start:'启动',restart:'重启',copy:'复制',delete:'删除'}[k];
 if(verb){pop(verb+'程序','<p>'+verb+'「'+esc(p.name)+'」？</p><small>仅修改当前预览的示例数据。</small>',verb);onSave=()=>{if(k==='delete'){entries.splice(i,1);index=0;full=false}else if(k==='copy'){entries.push({...p,id:Math.max(...entries.map(p=>p.id))+1,name:p.name+' 副本',state:1})}else if(k==='stop'){p.state=1}else if(p.entry&&p.state!==2){p.state=0;p.pid=p.pid||26001}else if(!p.entry){tab='settings';queueMicrotask(()=>act('settings',i))}else{queueMicrotask(()=>act('logs',i))}}}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(b)act(b.dataset.do,Number(b.dataset.index))});
addEventListener('hashchange',()=>{index=0;filter=-1;expanded=true;tab='log';full=false;modal.close();render()});render();
</script></html>
